<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tours | TravelSphere</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/tours-extra.css">
    <script src="../js/script-gallery.js"></script>
</head>
<body>

  <!-- Universal Navbar   -->
  <header class="navbar">
    <div class="nav-container">
        <div class="nav-logo">
          <img src="../TravelSphereSmallLogo.png" alt="TravelSphere Logo">
          <h1 class="logo">TravelSphere</h1>
        </div>
        <div class="nav-right">
          <nav class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../AboutUs.html">About Us</a>
            <a href="../culture/culture.html">Destinations</a>
            <a href="#">Tours</a>
            <a href="../contact.html">Contact</a>
          </nav>
        </div>
    </div>
  </header>

  <!-- page header -->
  <div class = "header">
      <h1>Our Tours</h1>
  </div>

  <!-- Search & Filter Bar -->
  <div class="search-bar">
    <input type="text" id="tour-search" placeholder="🔍 Search tours by name or location...">
    <select id="tour-sort">
      <option value="">Sort By</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
      <option value="rating">Top Rated</option>
      <option value="duration">Shortest Duration</option>
    </select>
  </div>
  
  <!-- Tours loaded dynamically from API -->
  <div class="container" id="tours-container">
    <p style="text-align:center; padding:2rem; color:#94a3b8; grid-column:1/-1;">Loading tours...</p>
  </div>
  
  <footer class="footer">
    <p>&copy; 2025 TravelSphere. All rights reserved.</p>
  </footer>

  <script src="../js/navbar.js"></script>
  <script src="../js/tours.js"></script>
</body>
</html>
