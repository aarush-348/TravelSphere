<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | TravelSphere</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <img src="TravelSphereSmallLogo.png" alt="TravelSphere Logo">
        <h1 class="logo">TravelSphere</h1>
      </div>
      <div class="nav-right">
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="AboutUs.html">About Us</a>
          <a href="culture/culture.html">Destinations</a>
          <a href="gallery/gallery.html">Tours</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </div>
  </header>

  <div class="auth-container">
    <h2>Create an Account</h2>
    <p class="auth-subtitle">Join TravelSphere and start exploring</p>

    <div id="auth-error" class="auth-error"></div>

    <form id="register-form" class="auth-form">
      <div>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>
      </div>
      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
      </div>
      <div>
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required minlength="6">
      </div>
      <button type="submit">Register</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2025 TravelSphere. All rights reserved.</p>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
